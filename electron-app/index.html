<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiri TTS - Khmer Voice Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top App Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </div>
      <div class="logo-text">
        <span class="app-title">Kiri TTS Studio</span>
        <span class="app-subtitle">Khmer Voice Engine Desktop</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Server Mode Selector -->
      <div class="server-pill">
        <span class="status-dot online" id="statusDot"></span>
        <select id="serverSelect" class="server-select">
          <option value="http://localhost:8000">ម៉ាស៊ីនផ្ទាល់ (Localhost - គ្មានដែនកំណត់)</option>
          <option value="https://kiri-tts-api.onrender.com">ក្លោដ (Render Cloud Server)</option>
        </select>
      </div>

      <button id="btnHealth" class="btn-icon" title="ពិនិត្យមើលស្ថានភាព Server">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-layout">
    
    <!-- Left / Center Workspace -->
    <section class="workspace">
      
      <!-- Input Card -->
      <div class="editor-card">
        <div class="editor-header">
          <div class="editor-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>អត្ថបទភាសាខ្មែរ (Khmer Script)</span>
          </div>
          
          <div class="editor-tools">
            <button id="btnPaste" class="tool-btn" title="បិទភ្ជាប់ពី Clipboard">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Paste</span>
            </button>
            <button id="btnClear" class="tool-btn danger" title="សម្អាតអត្ថបទ">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Clear</span>
            </button>
          </div>
        </div>

        <textarea id="khmerInput" placeholder="សូមសរសេរ ឬបិទភ្ជាប់ (Paste) អត្ថបទភាសាខ្មែរនៅទីនេះ... គាំទ្រទាំងអត្ថបទខ្លី និងព័ត៌មានវែងៗពេញលេញ"></textarea>

        <div class="editor-footer">
          <!-- Sample Templates -->
          <div class="samples-row">
            <span class="sample-label">គំរូសាកល្បង៖</span>
            <button class="chip-btn" data-text="សូមស្វាគមន៍មកកាន់ News Cambo Daily។ ព័ត៌មានជាតិ និងអន្តរជាតិសំខាន់ៗប្រចាំថ្ងៃ។">ព័ត៌មាន</button>
            <button class="chip-btn" data-text="សួស្តីបងប្អូនទាំងអស់គ្នា សូមស្វាគមន៍មកកាន់ប្រព័ន្ធសំឡេងឆ្លាតវៃ Kiri Khmer Voice!">ស្វាគមន៍</button>
            <button class="chip-btn" data-text="ប្រទេសកម្ពុជាសម្បូរទៅដោយប្រាង្គប្រាសាទបុរាណ និងវប្បធម៌ប្រពៃណីដ៏ផូរផង់។">វប្បធម៌</button>
          </div>

          <!-- Counter -->
          <div class="stats-badge">
            <span id="charCount">0</span> តួអក្សរ • <span id="wordCount">0</span> ពាក្យ
          </div>
        </div>
      </div>

      <!-- Action & Generation Panel -->
      <div class="action-panel">
        <div class="settings-strip">
          <div class="setting-item">
            <label>សំឡេង (Voice):</label>
            <select id="voiceSelect" class="styled-select">
              <option value="Maly">Maly (ស្ត្រីធម្មជាតិ - Female)</option>
              <option value="Kiri">Kiri (បុរសច្បាស់ - Male)</option>
            </select>
          </div>

          <div class="setting-item">
            <label>ទ្រង់ទ្រាយ (Format):</label>
            <select id="formatSelect" class="styled-select">
              <option value="mp3">MP3 (192 kbps HD)</option>
              <option value="wav">WAV (Raw Audio)</option>
            </select>
          </div>
        </div>

        <button id="btnGenerate" class="btn-generate">
          <span class="btn-sparkle">✨</span>
          <span id="btnGenText">បង្កើតសំឡេង (Generate Speech)</span>
          <div id="btnSpinner" class="spinner-small" style="display:none;"></div>
        </button>
      </div>

      <!-- Status or Error Message -->
      <div id="msgBox" class="msg-box" style="display:none;"></div>

      <!-- Player Box (Appears when ready) -->
      <div id="playerBox" class="player-card" style="display:none;">
        <div class="player-header">
          <div class="player-title">
            <span class="badge-success">✓ ជោគជ័យ</span>
            <span id="audioTitle">សំឡេងត្រូវបានបង្កើតរួចរាល់</span>
          </div>
          <span id="audioMeta" class="audio-meta">-- KB • MP3</span>
        </div>

        <div class="audio-control-row">
          <audio id="audioEl" controls preload="auto"></audio>
        </div>

        <div class="player-actions">
          <button id="btnSaveFile" class="btn-primary-action">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>រក្សាទុកជា MP3 ទៅកុំព្យូទ័រ (Save MP3)</span>
          </button>
          
          <button id="btnCopyAudioUrl" class="btn-secondary-action">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyUrlText">ចម្លង Link</span>
          </button>
        </div>
      </div>

    </section>

    <!-- Right Sidebar (History & Account Info) -->
    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>ប្រវត្តិសំឡេង (Recent Clips)</span>
        </div>
        
        <div id="historyList" class="history-list">
          <div class="empty-state">មិនទាន់មានប្រវត្តិសំឡេងនៅឡើយទេ</div>
        </div>
      </div>

      <div class="sidebar-card account-card">
        <div class="sidebar-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>គណនី Kiri TTS (Account Pool)</span>
        </div>
        <div id="accountPoolInfo" class="account-info">កំពុងត្រួតពិនិត្យ...</div>
      </div>
    </aside>

  </main>

  <script src="renderer.js"></script>
</body>
</html>
